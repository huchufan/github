# 多智能体管理架构配置
# 设计文档: 06_多智能体管理架构.md

agent_roles:
  coordinator:
    count_per_cluster: 1-3
    priority: "HIGH"
    fallback: "ELECT_NEW_COORDINATOR"
  worker:
    count_per_cluster: "flexible"
    priority: "MEDIUM"
  specialist:
    availability: "on_demand"
    priority: "MEDIUM"
  monitor:
    count_per_cluster: 1-2
    priority: "HIGH"
  learner:
    count_per_cluster: 1-2
    priority: "LOW"

message_types: [TASK, RESULT, HEARTBEAT, STATUS, EVENT, RPC_REQUEST, RPC_RESPONSE]

cluster:
  scale_check_interval: "300s"
  scale_up_threshold: { avg_load: 0.85, avg_response_time_ms: 2000 }
  scale_down_threshold: { avg_load: 0.30 }
