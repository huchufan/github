name: compat-imports
on:
  push:
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'tests/integration/compat_imports/**'
  pull_request:
    paths:
      - 'tests/**'
jobs:
  compat-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run compat import smoke tests
        run: |
          python tests/integration/compat_imports/test_tools_reexport.py
