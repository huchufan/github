# Governance CI workflow (completed skeleton)
name: Governance CI

on:
  push:
    paths:
      - 'agent/governance/**'
      - '.github/workflows/governance-ci.yml'
  pull_request:
    paths:
      - 'agent/governance/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run governance tests
        run: pytest -q agent/governance/tests
