name: weekly-report

on:
  schedule:
    - cron: '0 9 * * 1' # every Monday 09:00 UTC (adjust as needed)
  workflow_dispatch: {}

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run weekly report generator
        run: |
          python3 tools/weekly_report_generator.py
      - name: Commit generated report
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@local"
          git add "Documents/obsidian/obsidian_mac/INBOX_收集箱/Hermes/WEEKLY_AUTOGEN_$(date -u +'%Y-%m-%d').md" || true
          git commit -m "chore(weekly): add autogenerated weekly report" || true
          git push origin HEAD:main || true
